name: CI

# Validate every push to main and every pull request: build the debug APK, run the JVM unit
# tests (classifier, parsers, exporters), and run Android Lint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this job only builds and uploads artifacts.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. a new push to a PR) to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle's daemon toolchain is pinned to 21 (gradle/gradle-daemon-jvm.properties); providing
      # it directly avoids a foojay download on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birdwatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
