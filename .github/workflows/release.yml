name: Release build

# Two ways to release, both using rolling date versions (YYYY.MM.N, e.g. 2026.09.1):
#
#   1. Run this workflow by hand from the Actions tab with the new version as input. It builds
#      the commit of the branch you launched it from and the release step CREATES the tag there
#      (no need to tag first). This is the normal path.
#   2. Push a tag yourself:  git tag 2026.09.1 && git push origin 2026.09.1
#
# Either way: signed, minified APK -> GitHub Release with BirdWatch-<tag>.apk, its SHA-256, the
# R8 mapping file, and the signing certificate's SHA-1 in the notes.
# versionName = the tag; versionCode = YYYYMM * 100 + N (see app/build.gradle.kts).
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to release (YYYY.MM.N, e.g. 2026.09.1). The tag is created on this commit if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a date version (YYYY.MM.N, e.g. 2026.09.1)"
            exit 1
          fi

      # Tag push: checks out the tagged commit. Manual run: checks out the commit of the branch the
      # workflow was launched from, which is where the release step will create the tag.
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is stored as a base64-encoded repository secret and decoded to a temp file.
      #   base64 -i release.jks | pbcopy      (then paste into the KEYSTORE_BASE64 secret)
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish a debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          BIRDWATCH_VERSION: ${{ env.RELEASE_TAG }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BirdWatch-$RELEASE_TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "BirdWatch-$RELEASE_TAG-mapping.txt"
          sha256sum "BirdWatch-$RELEASE_TAG.apk" > "BirdWatch-$RELEASE_TAG.apk.sha256"

      # Users restrict their Google Maps API key to this package + the signing certificate's
      # SHA-1 (see README, "Optional: a Google Maps API key"), so publish the fingerprint with
      # every release. The generated release notes are appended below this body.
      - name: Write release notes header
        run: |
          SHA1=$(keytool -printcert -jarfile "BirdWatch-$RELEASE_TAG.apk" | awk '/SHA1:/ {print $2; exit}')
          SHA256_APK=$(cut -d' ' -f1 "BirdWatch-$RELEASE_TAG.apk.sha256")
          {
            echo "**Install:** download \`BirdWatch-$RELEASE_TAG.apk\` and sideload it. Package \`com.khasmek.birdwatch\`."
            echo
            echo "**Signing certificate SHA-1** (for locking a Google Maps API key to this app): \`$SHA1\`"
            echo
            echo "**APK SHA-256:** \`$SHA256_APK\`"
            echo
            echo "---"
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Creates the tag at the built commit when it doesn't exist yet (manual runs).
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          body_path: release-body.md
          generate_release_notes: true
          files: |
            BirdWatch-${{ env.RELEASE_TAG }}.apk
            BirdWatch-${{ env.RELEASE_TAG }}.apk.sha256
            BirdWatch-${{ env.RELEASE_TAG }}-mapping.txt
