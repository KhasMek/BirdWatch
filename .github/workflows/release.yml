name: Release build

# Two ways to release, both using rolling date versions (YYYY.MM.N, e.g. 2026.09.1):
#
#   1. Run this workflow by hand from the Actions tab with the new version as input. It builds
#      the commit of the branch you launched it from and the release step CREATES the tag there
#      (no need to tag first). This is the normal path.
#   2. Push a tag yourself:  git tag 2026.09.1 && git push origin 2026.09.1
#
# Either way: signed, minified APK -> GitHub Release with BirdWatch-<tag>.apk, its SHA-256, the
# R8 mapping file, and the signing certificate's SHA-1 in the notes.
# versionName = the tag; versionCode = YYYYMM * 100 + N (see app/build.gradle.kts).
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to release (YYYY.MM.N, e.g. 2026.09.1). The tag is created on this commit if it doesn't exist."
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub Release

# One release per version at a time: two dispatches for the same tag must not race each other.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]?$ ]]; then
            echo "::error::Tag '$RELEASE_TAG' is not a date version (YYYY.MM.N, e.g. 2026.09.1)"
            exit 1
          fi

      # Tag push: checks out the tagged commit. Manual run: checks out the commit of the branch the
      # workflow was launched from, which is where the release step will create the tag.
      - uses: actions/checkout@v4

      # A version is immutable once published. Re-running for an existing tag from a different
      # commit would silently replace that release's APK with a build of untagged code, and users
      # who already downloaded it would hold a sha256 that no longer matches. Bump N instead.
      - name: Refuse to reuse a published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null; then
            TAGGED=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAGGED" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG already exists on $TAGGED, not on $GITHUB_SHA. Use the next release number."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for $RELEASE_TAG already exists. Use the next release number."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is stored as a base64-encoded repository secret and decoded to a temp file.
      #   base64 -i release.jks | pbcopy      (then paste into the KEYSTORE_BASE64 secret)
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # All four are needed; an empty one would surface later as an opaque keystore error.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; refusing to build an unsigned release"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The signing config is read from the environment when Gradle configures the build, so
      # every Gradle call in this job must carry these variables. Tests run in the same call.
      - name: Build signed release APK
        env:
          BIRDWATCH_VERSION: ${{ env.RELEASE_TAG }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      # Belt and braces: refuse to publish anything signed with an Android debug certificate.
      # NOTE: `keytool -printcert -jarfile` cannot read APK v2/v3 signatures ("Not a signed jar
      # file"); apksigner from the SDK build-tools is the right tool.
      - name: Verify release signature
        run: |
          # Newest build-tools directory that actually contains apksigner.
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > cert.txt
          cat cert.txt
          if grep -q "Android Debug" cert.txt; then
            echo "::error::APK is signed with a debug certificate; release signing did not apply"
            exit 1
          fi

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BirdWatch-$RELEASE_TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "BirdWatch-$RELEASE_TAG-mapping.txt"
          sha256sum "BirdWatch-$RELEASE_TAG.apk" > "BirdWatch-$RELEASE_TAG.apk.sha256"

      # Users restrict their Google Maps API key to this package + the signing certificate's
      # SHA-1 (see README, "Optional: a Google Maps API key"), so publish the fingerprint with
      # every release. The generated release notes are appended below this body.
      - name: Write release notes header
        run: |
          # apksigner prints the digest as lowercase hex without separators; format it the way the
          # Google Cloud Console expects (AA:BB:CC:...).
          SHA1=$("$APKSIGNER" verify --print-certs "BirdWatch-$RELEASE_TAG.apk" \
            | awk '/SHA-1 digest:/ {print toupper($NF); exit}' | sed 's/../&:/g; s/:$//')
          SHA256_APK=$(cut -d' ' -f1 "BirdWatch-$RELEASE_TAG.apk.sha256")
          {
            echo "**Install:** download \`BirdWatch-$RELEASE_TAG.apk\` and sideload it. Package \`com.khasmek.birdwatch\`."
            echo
            echo "**Signing certificate SHA-1** (for locking a Google Maps API key to this app): \`$SHA1\`"
            echo
            echo "**APK SHA-256:** \`$SHA256_APK\`"
            echo
            echo "---"
          } > release-body.md
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Creates the tag at the built commit when it doesn't exist yet (manual runs).
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TAG }}
          draft: false
          body_path: release-body.md
          generate_release_notes: true
          files: |
            BirdWatch-${{ env.RELEASE_TAG }}.apk
            BirdWatch-${{ env.RELEASE_TAG }}.apk.sha256
            BirdWatch-${{ env.RELEASE_TAG }}-mapping.txt
